<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tapout Setup</title>
<meta name="description" content="Build your own tap-to-lock phone blocker with an NFC sticker and a free, open-source app.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://lebotomy.github.io/tapout/">
<meta property="og:title" content="Tapout: tap the fridge, lock your apps">
<meta property="og:description" content="Build your own Brick with an NFC sticker and a free, open-source app.">
<meta property="og:image" content="https://lebotomy.github.io/tapout/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<script>
  (function () {
    var root = document.documentElement;
    if (root.hasAttribute("data-theme")) return;
    var saved = null;
    try { saved = localStorage.getItem("tapout:theme"); } catch (e) {}
    root.setAttribute("data-theme", saved === "dark" ? "dark" : "light");
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,600..800,100&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --paper: #efe4d3;
    --card: #f9f2e7;
    --ink: #2a1a12;
    --muted: #6b5446;
    --line: #e0d1bb;
    --s1: #f6c9a8;
    --s2: #ef8a52;
    --s3: #d2461c;
    --s4: #4a2616;
    --fill: #f8dcc6;
    --strong: #a3330f;
    --fill-ink: #3a1a0c;
    --pill-bg: #e9dbc6;
    --btn-bg: #b93a12;
    --btn-ink: #fff8f0;
    --display: "Fraunces", "Cooper Black", Georgia, serif;
    --body: "Instrument Sans", ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --stripe: 11px;
  }
  :root[data-theme="dark"] {
    --paper: #2a1d17;
    --card: #35261f;
    --ink: #f3e8dc;
    --muted: #c0aa97;
    --line: #4b382e;
    --s1: #5a2c18;
    --s2: #a8401b;
    --s3: #ef7a45;
    --s4: #f8c9a6;
    --fill: #4f2b1b;
    --strong: #f59a6a;
    --fill-ink: #fbe9dc;
    --pill-bg: #413027;
    --btn-bg: #ef7a45;
    --btn-ink: #2a1d17;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 400 1rem/1.6 var(--body);
    overflow-x: hidden;
  }
  a { color: var(--strong); text-underline-offset: 3px; }
  button { font: inherit; color: inherit; }

  /* 70s stripes: four concentric bands that echo the NFC waves */
  .stripes {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 560px;
    pointer-events: none;
    -webkit-mask-image: linear-gradient(to bottom, #000 62%, transparent);
    mask-image: linear-gradient(to bottom, #000 62%, transparent);
  }
  .stripes span {
    position: absolute;
    left: -2px;
    border-style: solid;
    border-width: var(--stripe) var(--stripe) 0 0;
    border-top-right-radius: 120px;
  }
  .stripes span:nth-child(1) { top: 28px; right: 28px; bottom: 0; border-color: var(--s4); }
  .stripes span:nth-child(2) { top: calc(28px + var(--stripe) * 1.6); right: calc(28px + var(--stripe) * 1.6); bottom: 0; border-color: var(--s3); border-top-right-radius: calc(120px - var(--stripe) * 1.6); }
  .stripes span:nth-child(3) { top: calc(28px + var(--stripe) * 3.2); right: calc(28px + var(--stripe) * 3.2); bottom: 0; border-color: var(--s2); border-top-right-radius: calc(120px - var(--stripe) * 3.2); }
  .stripes span:nth-child(4) { top: calc(28px + var(--stripe) * 4.8); right: calc(28px + var(--stripe) * 4.8); bottom: 0; border-color: var(--s1); border-top-right-radius: calc(120px - var(--stripe) * 4.8); }

  main {
    position: relative;
    max-width: 660px;
    margin: 0 auto;
    padding-inline: 16px;
    padding-block: 132px 96px;
  }

  .hero { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: end; margin-bottom: 40px; }
  .eyebrow {
    font: 500 0.75rem/1 var(--mono);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 14px;
  }
  h1 {
    font-family: var(--display);
    font-weight: 700;
    font-variation-settings: "opsz" 144, "SOFT" 100;
    font-size: clamp(2.5rem, 8vw, 4rem);
    line-height: 1.02;
    letter-spacing: -0.01em;
    margin: 0 0 18px;
    text-wrap: balance;
  }
  .lede { color: var(--muted); font-size: 1.08rem; max-width: 34ch; margin: 0; }

  .tag { width: 132px; height: 132px; flex: none; }
  .tag circle { fill: none; }
  .tag .wave { stroke-width: 5; transform-origin: 66px 66px; }
  .tag .w1 { stroke: var(--s3); }
  .tag .w2 { stroke: var(--s2); }
  .tag .w3 { stroke: var(--s1); }
  .tag .disc { fill: var(--ink); }
  .tag .label { fill: var(--paper); font: 700 11px var(--mono); letter-spacing: 0.08em; }
  .tag.pulse .wave { animation: ring 1.1s ease-out both; }
  .tag.pulse .w2 { animation-delay: 0.12s; }
  .tag.pulse .w3 { animation-delay: 0.24s; }
  @keyframes ring { 0% { opacity: 0.2; transform: scale(0.82); } 60% { opacity: 1; transform: scale(1.06); } 100% { opacity: 1; transform: scale(1); } }

  .eyebrow-row { display: flex; align-items: center; gap: 12px; margin: 0 0 14px; }
  .eyebrow-row .eyebrow { margin: 0; }
  .theme-toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    border-radius: 999px;
    border: 1.5px solid var(--line);
    background: var(--card);
    font: 500 0.72rem/1 var(--mono);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer;
  }
  .theme-toggle:hover { color: var(--ink); border-color: var(--muted); }
  .theme-toggle:focus-visible { outline: 3px solid var(--strong); outline-offset: 3px; }
  .theme-toggle svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }

  .question { margin-bottom: 28px; }
  .q-label {
    display: flex;
    align-items: baseline;
    gap: 10px;
    font: 600 1.05rem/1.3 var(--body);
    margin: 0 0 12px;
  }
  .q-label b { font: 500 0.75rem var(--mono); color: var(--muted); letter-spacing: 0.08em; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .choice {
    position: relative;
    display: grid;
    grid-template-columns: 36px 1fr;
    gap: 12px;
    align-items: center;
    text-align: left;
    padding: 16px;
    border-radius: 18px;
    border: 2px solid var(--line);
    background: var(--card);
    cursor: pointer;
    transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
  }
  .choice:hover { border-color: var(--muted); }
  .choice:active { transform: scale(0.98); }
  .choice svg { width: 36px; height: 36px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .choice strong { display: block; font-weight: 600; }
  .choice small { display: block; color: var(--muted); font-size: 0.86rem; line-height: 1.35; }
  .choice[aria-pressed="true"] { border-color: var(--ink); background: var(--fill); color: var(--fill-ink); }
  .choice[aria-pressed="true"] small { color: inherit; opacity: 0.78; }
  .choice .check {
    position: absolute;
    top: -9px;
    right: -9px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--ink);
    color: var(--paper);
    display: none;
    place-items: center;
  }
  .choice .check svg { width: 14px; height: 14px; stroke-width: 3; }
  .choice[aria-pressed="true"] .check { display: grid; }
  .choice:focus-visible, .step-head:focus-visible, .done-btn:focus-visible { outline: 3px solid var(--strong); outline-offset: 3px; }

  .progress { display: flex; align-items: center; gap: 14px; margin: 44px 0 18px; }
  .segments { flex: 1; display: grid; grid-auto-flow: column; gap: 6px; }
  .segments i { height: 8px; border-radius: 4px; background: var(--line); transition: background 0.2s; }
  .segments i.on { background: var(--s3); }
  .progress-text { font: 500 0.8rem var(--mono); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

  .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .step { border-radius: 20px; border: 1px solid var(--line); background: var(--card); }
  .step.open { border-color: var(--ink); }
  .step-head {
    width: 100%;
    display: grid;
    grid-template-columns: 34px 1fr;
    gap: 12px;
    align-items: center;
    text-align: left;
    padding: 16px 18px;
    border: 0;
    background: none;
    cursor: pointer;
    border-radius: 20px;
  }
  .num {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font: 500 0.85rem var(--mono);
    border: 1.5px solid var(--line);
  }
  .step.open .num { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .step.done .num { background: var(--s3); border-color: var(--s3); color: var(--paper); }
  .step.done .num svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 3; fill: none; }
  .step-title { font: 600 1.05rem/1.3 var(--body); }
  .step.done .step-title { color: var(--muted); }
  .step-body { padding: 0 22px 22px 64px; }
  .step-body p { margin: 0 0 12px; }
  .step-body ol { margin: 0 0 12px; padding-left: 20px; }
  .step-body li { margin-bottom: 6px; }
  .step-body li::marker { color: var(--muted); }

  .settings { display: grid; gap: 0; margin: 4px 0 14px; border-top: 1px solid var(--line); }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .row-name { font-weight: 600; }
  .row-name small { display: block; font-weight: 400; color: var(--muted); font-size: 0.86rem; line-height: 1.35; }
  .pill { font: 500 0.78rem var(--mono); padding: 4px 10px; border-radius: 999px; background: var(--pill-bg); white-space: nowrap; }
  .pill.on { background: var(--s4); color: var(--paper); }

  .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 6px; }
  .btn, .done-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 11px 16px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 0.95rem;
    text-decoration: none;
    cursor: pointer;
  }
  .btn { background: var(--btn-bg); color: var(--btn-ink); border: 2px solid var(--btn-bg); }
  .done-btn { background: transparent; border: 2px solid var(--ink); }

  .finish { text-align: center; padding: 36px 0 0; }
  .finish h2 { font: 700 2rem/1.1 var(--display); font-variation-settings: "opsz" 144, "SOFT" 100; margin: 0 0 8px; }
  .finish p { color: var(--muted); margin: 0; }

  footer { color: var(--muted); font-size: 0.85rem; margin-top: 64px; padding-top: 18px; border-top: 1px solid var(--line); }
  [hidden] { display: none !important; }

  @media (max-width: 560px) {
    :root { --stripe: 7px; }
    .stripes { height: 250px; }
    main { padding-block: 108px 72px; }
    .hero { grid-template-columns: 1fr; }
    .tag { display: none; }
    h1 { padding-right: 40px; }
    .choices { grid-template-columns: 1fr; }
    .step-body { padding: 0 18px 20px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="stripes" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
<main>
  <header class="hero">
    <div>
      <div class="eyebrow-row">
        <p class="eyebrow">DIY Brick</p>
        <button class="theme-toggle" id="theme-toggle" type="button"></button>
      </div>
      <h1>Tap the fridge. Lock your apps.</h1>
      <p class="lede">An NFC sticker and a free, open-source app do what a Brick does. Pick your phone to start.</p>
    </div>
    <svg class="tag" id="tag" viewBox="0 0 132 132" aria-hidden="true">
      <circle class="wave w3" cx="66" cy="66" r="62"/>
      <circle class="wave w2" cx="66" cy="66" r="51"/>
      <circle class="wave w1" cx="66" cy="66" r="40"/>
      <circle class="disc" cx="66" cy="66" r="29"/>
      <text class="label" x="66" y="70" text-anchor="middle">NFC</text>
    </svg>
  </header>

  <section class="question">
    <h2 class="q-label">Your phone</h2>
    <div class="choices" data-q="phone">
      <button class="choice" id="q-iphone" data-v="iphone" aria-pressed="false">
        <svg viewBox="0 0 36 36"><rect x="10" y="3" width="16" height="30" rx="4"/><path d="M16 7h4"/></svg>
        <span><strong>iPhone</strong><small>iOS 17.6+</small></span>
        <span class="check"><svg viewBox="0 0 14 14"><path d="M3 7.5l2.5 2.5L11 4"/></svg></span>
      </button>
      <button class="choice" id="q-android" data-v="android" aria-pressed="false">
        <svg viewBox="0 0 36 36"><rect x="10" y="3" width="16" height="30" rx="2.5"/><circle cx="18" cy="7" r="0.8"/></svg>
        <span><strong>Android</strong><small>Android 13+ with NFC</small></span>
        <span class="check"><svg viewBox="0 0 14 14"><path d="M3 7.5l2.5 2.5L11 4"/></svg></span>
      </button>
    </div>
  </section>

  <section id="plan" hidden>
    <div class="progress">
      <div class="segments" id="segments"></div>
      <div class="progress-text" id="progress-text"></div>
    </div>
    <ol class="steps" id="steps"></ol>
    <div class="finish" id="finish" hidden>
      <h2>Done. Go tap it.</h2>
      <p>Built one? Share a photo on <a href="https://github.com/lebotomy/tapout">GitHub</a>.</p>
    </div>
  </section>

  <footer>
    Not affiliated with Brick, Foqos, or Lock.
    Source: <a href="https://github.com/lebotomy/tapout">github.com/lebotomy/tapout</a>
  </footer>
</main>

<script>
  const row = (name, value, kind = "", hint = "") =>
    `<div class="row"><div class="row-name">${name}${hint ? `<small>${hint}</small>` : ""}</div><span class="pill ${kind}">${value}</span></div>`;

  const STEPS = {
    buy: () => ({
      title: "Buy anti-metal NFC tags",
      body: `
        <p>Must say <b>anti-metal</b> or <b>on-metal</b>. NTAG215 or NTAG213. Not MIFARE Classic.</p>`,
      link: ["https://www.amazon.com/s?k=anti-metal+NFC+tag+NTAG215+25mm", "Find them on Amazon"]
    }),
    installIphone: () => ({
      title: "Install Foqos",
      body: `
        <p>Open it and tap <strong>Allow</strong> when it asks for Screen Time access.</p>`,
      link: ["https://apps.apple.com/app/foqos/id6736793117", "Get Foqos on the App Store"]
    }),
    profileIphone: () => ({
      title: "Create a profile",
      body: `
        <p>Create a new profile and set these. Leave everything else as is.</p>
        <div class="settings">
          ${row("Method", "NFC Tags", "on")}
          ${row("Apps", "Your pick", "", "The apps to block.")}
          ${row("Prevent App Deletion", "On", "on")}
          ${row("Emergency Unblock", "On", "on", "3 every 4 weeks, for real emergencies.")}
        </div>`
    }),
    pairIphone: () => ({
      title: "Write the profile to your tag",
      body: `
        <ol>
          <li>Open the profile.</li>
          <li>Tap <strong>⋯</strong>, then <strong>Write to NFC Tag</strong>.</li>
          <li>Hold the top of your iPhone to the tag.</li>
        </ol>`
    }),
    installAndroid: () => ({
      title: "Install Lock",
      body: `
        <p>Open it and turn on <strong>Accessibility Service</strong> when it asks.</p>`,
      link: ["https://play.google.com/store/apps/details?id=com.nathanb.lock", "Get Lock on Google Play"]
    }),
    profileAndroid: () => ({
      title: "Create a profile",
      body: `<p>Create a profile and pick the apps to block.</p>`
    }),
    pairAndroid: () => ({
      title: "Pair your tag",
      body: `<p>Pair a tag in Lock and hold the middle of your phone's back to it.</p>`
    }),
    place: () => ({
      title: "Stick it far away",
      body: `<p>The fridge, a doorframe, the front door. Want a magnet or keychain? See <a href="https://github.com/lebotomy/tapout/blob/main/ideas.md">ideas</a>.</p>`
    }),
    test: (s) => ({
      title: "Test it",
      body: `
        <ol>
          <li>Tap the tag${s.phone === "iphone" ? ", then the notification" : ""}. Your apps lock.</li>
          <li>Tap it again. They unlock.</li>
        </ol>
        <p>Not reading? Take off a thick case and hold still for a second.</p>`
    })
  };

  const ORDER = {
    iphone: ["buy", "installIphone", "profileIphone", "pairIphone", "place", "test"],
    android: ["buy", "installAndroid", "profileAndroid", "pairAndroid", "place", "test"]
  };
  const CHECK = '<svg viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7"/></svg>';

  const state = { phone: null, open: null };
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  function readHash() {
    const phone = location.hash.slice(1).split("-")[0];
    if (ORDER[phone]) state.phone = phone;
  }

  function pulse() {
    const tag = document.getElementById("tag");
    tag.classList.remove("pulse");
    void tag.getBoundingClientRect();
    tag.classList.add("pulse");
  }

  function render() {
    document.querySelectorAll(".choices").forEach((group) => {
      group.querySelectorAll(".choice").forEach((btn) => {
        btn.setAttribute("aria-pressed", String(state[group.dataset.q] === btn.dataset.v));
      });
    });

    const plan = document.getElementById("plan");
    if (!state.phone) { plan.hidden = true; return; }
    plan.hidden = false;
    history.replaceState(null, "", `#${state.phone}`);

    const key = `tapout:${state.phone}`;
    const done = store.get(key) || {};
    const ids = ORDER[state.phone];
    if (!ids.includes(state.open)) state.open = ids.find((id) => !done[id]) || null;

    document.getElementById("steps").innerHTML = ids.map((id, i) => {
      const step = STEPS[id](state);
      const isOpen = state.open === id;
      const cls = [done[id] ? "done" : "", isOpen ? "open" : ""].join(" ");
      return `
        <li class="step ${cls}">
          <button class="step-head" id="h-${id}" data-id="${id}" aria-expanded="${isOpen}">
            <span class="num">${done[id] ? CHECK : i + 1}</span>
            <span class="step-title">${step.title}</span>
          </button>
          ${isOpen ? `<div class="step-body">${step.body}
            <div class="actions">
              ${step.link ? `<a class="btn" href="${step.link[0]}" target="_blank" rel="noopener">${step.link[1]}</a>` : ""}
              <button class="done-btn" id="d-${id}" data-done="${id}">${done[id] ? "Mark not done" : i === ids.length - 1 ? "Done" : "Done, next step"}</button>
            </div>
          </div>` : ""}
        </li>`;
    }).join("");

    const count = ids.filter((id) => done[id]).length;
    document.getElementById("segments").innerHTML = ids.map((id) => `<i class="${done[id] ? "on" : ""}"></i>`).join("");
    document.getElementById("progress-text").textContent = `${count}/${ids.length}`;
    document.getElementById("finish").hidden = count !== ids.length;

    document.querySelectorAll(".step-head").forEach((head) => {
      head.addEventListener("click", () => {
        state.open = state.open === head.dataset.id ? "" : head.dataset.id;
        render();
      });
    });
    document.querySelectorAll("[data-done]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const id = btn.dataset.done;
        done[id] = !done[id];
        store.set(key, done);
        state.open = done[id] ? (ids.find((x) => !done[x]) || null) : id;
        if (ids.every((x) => done[x])) pulse();
        render();
      });
    });
  }

  document.querySelectorAll(".choices").forEach((group) => {
    group.addEventListener("click", (e) => {
      const btn = e.target.closest(".choice");
      if (!btn) return;
      state[group.dataset.q] = btn.dataset.v;
      state.open = null;
      pulse();
      render();
    });
  });

  const SUN = '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1 1M11.6 11.6l1 1M3.4 12.6l1-1M11.6 4.4l1-1"/></svg>';
  const MOON = '<svg viewBox="0 0 16 16"><path d="M13 9.5A5.5 5.5 0 0 1 6.5 3a5.5 5.5 0 1 0 6.5 6.5z"/></svg>';
  const toggle = document.getElementById("theme-toggle");
  function paintToggle() {
    const dark = document.documentElement.getAttribute("data-theme") === "dark";
    toggle.innerHTML = dark ? `${SUN}Light` : `${MOON}Dark`;
    toggle.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
  }
  toggle.addEventListener("click", () => {
    const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("tapout:theme", next); } catch (e) {}
    paintToggle();
  });
  paintToggle();

  readHash();
  render();
  pulse();
</script>
</body>
</html>
